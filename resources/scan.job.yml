# <env>_phi_classification_scan: weekly metadata scan, then review-request emails to each scope's reviewers.
# The review App runs it on demand with correction_* parameters to open a CORRECTION_REQUESTED item.
resources:
  jobs:
    phi_classification_scan:
      name: ${var.env}_phi_classification_scan
      max_concurrent_runs: 1
      email_notifications:
        on_failure: ${var.failure_notification_emails}
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: ${var.business_timezone}
      parameters:
        - name: process_name
          default: ${var.env}_phi_classification_scan
        - name: env
          default: ${var.env}
        - name: run_id
          default: "{{job.run_id}}"
        - name: governance_catalog
          default: ${var.governance_catalog}
        - name: governance_schema
          default: ${var.governance_schema}
        - name: governed_catalog_prefix
          default: ${var.governed_catalog_prefix}
        - name: tag_key
          default: ${var.tag_key}
        - name: governance_group
          default: ${var.governance_group}
        - name: data_classification_table
          default: ${var.data_classification_table}
        - name: review_due_business_days
          default: ${var.review_due_business_days}
        - name: business_timezone
          default: ${var.business_timezone}
        - name: detect_orphaned_tags
          default: ${var.detect_orphaned_tags}
        - name: allowed_values_override
          default: ${var.allowed_values_override}
        - name: excluded_table_regex
          default: ${var.excluded_table_regex}
        - name: review_app_name
          default: ${var.review_app_name}
        - name: smtp_host
          default: ${var.smtp_host}
        - name: smtp_port
          default: ${var.smtp_port}
        - name: smtp_sender
          default: ${var.smtp_sender}
        - name: smtp_secret_scope
          default: ${var.smtp_secret_scope}
        - name: smtp_use_tls
          default: ${var.smtp_use_tls}
        - name: correction_column
          default: ""
        - name: correction_reason
          default: ""
        - name: correction_requested_by
          default: ""
      tasks:
        - task_key: scan
          environment_key: framework
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 7200
          python_wheel_task:
            package_name: phi_framework
            entry_point: scan
            parameters:
                - --env
                - "{{job.parameters.env}}"
                - --process-name
                - "{{job.parameters.process_name}}"
                - --run-id
                - "{{job.parameters.run_id}}"
                - --governance-catalog
                - "{{job.parameters.governance_catalog}}"
                - --governance-schema
                - "{{job.parameters.governance_schema}}"
                - --governed-catalog-prefix
                - "{{job.parameters.governed_catalog_prefix}}"
                - --tag-key
                - "{{job.parameters.tag_key}}"
                - --governance-group
                - "{{job.parameters.governance_group}}"
                - --data-classification-table
                - "{{job.parameters.data_classification_table}}"
                - --review-due-business-days
                - "{{job.parameters.review_due_business_days}}"
                - --business-timezone
                - "{{job.parameters.business_timezone}}"
                - --detect-orphaned-tags
                - "{{job.parameters.detect_orphaned_tags}}"
                - --allowed-values-override
                - "{{job.parameters.allowed_values_override}}"
                - --excluded-table-regex
                - "{{job.parameters.excluded_table_regex}}"
                - --correction-column
                - "{{job.parameters.correction_column}}"
                - --correction-reason
                - "{{job.parameters.correction_reason}}"
                - --correction-requested-by
                - "{{job.parameters.correction_requested_by}}"
        - task_key: notify_reviewers
          depends_on:
            - task_key: scan
          run_if: ALL_SUCCESS
          environment_key: framework
          max_retries: 0  # a retry could resend emails for batches sent before a failure
          min_retry_interval_millis: 60000
          timeout_seconds: 7200
          python_wheel_task:
            package_name: phi_framework
            entry_point: notify
            parameters:
                - --env
                - "{{job.parameters.env}}"
                - --process-name
                - "{{job.parameters.process_name}}"
                - --run-id
                - "{{job.parameters.run_id}}"
                - --governance-catalog
                - "{{job.parameters.governance_catalog}}"
                - --governance-schema
                - "{{job.parameters.governance_schema}}"
                - --governed-catalog-prefix
                - "{{job.parameters.governed_catalog_prefix}}"
                - --tag-key
                - "{{job.parameters.tag_key}}"
                - --governance-group
                - "{{job.parameters.governance_group}}"
                - --data-classification-table
                - "{{job.parameters.data_classification_table}}"
                - --review-due-business-days
                - "{{job.parameters.review_due_business_days}}"
                - --business-timezone
                - "{{job.parameters.business_timezone}}"
                - --detect-orphaned-tags
                - "{{job.parameters.detect_orphaned_tags}}"
                - --allowed-values-override
                - "{{job.parameters.allowed_values_override}}"
                - --excluded-table-regex
                - "{{job.parameters.excluded_table_regex}}"
                - --review-app-name
                - "{{job.parameters.review_app_name}}"
                - --smtp-host
                - "{{job.parameters.smtp_host}}"
                - --smtp-port
                - "{{job.parameters.smtp_port}}"
                - --smtp-sender
                - "{{job.parameters.smtp_sender}}"
                - --smtp-secret-scope
                - "{{job.parameters.smtp_secret_scope}}"
                - --smtp-use-tls
                - "{{job.parameters.smtp_use_tls}}"
      environments:
        - environment_key: framework
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      permissions:
        - group_name: ${var.platform_group}
          level: CAN_MANAGE
        - group_name: ${var.governance_group}
          level: CAN_MANAGE_RUN
