# PHI Classification Framework -- Declarative Automation Bundle.
#
# One bundle, one target per environment. Each target deploys the same jobs to
# its own workspace and governance catalog and processes only that
# environment's catalogs.
#
# Workspace hosts are intentionally not hard-coded: deploy with a CLI profile
# (`-p <profile>`) locally, or DATABRICKS_HOST / OAuth M2M credentials in CI.
bundle:
  name: phi_classification_framework

include:
  - resources/*.yml

artifacts:
  phi_framework_wheel:
    type: whl
    build: uv build --wheel

variables:
  env:
    description: Deployment environment (dev, qa, prod). Logical job names are <env>_phi_<job>.
  governance_catalog:
    description: Catalog that holds the governance schema (for example <env>_delivery_gold).
  governance_schema:
    description: Governance schema name.
    default: data_governance
  governed_catalog_prefix:
    description: Every governed catalog in this environment starts with this prefix (environment guardrail).
  tag_key:
    description: Governed tag applied to PHI columns. Its allowed values come from the tag policy.
    default: phi_classification
  governance_group:
    description: Data Governance group (may record Privacy outcomes, request corrections, run the scan on demand).
  platform_group:
    description: Data Platform group that operates the jobs.
  data_classification_table:
    description: Data Classification results table. Set to "" to disable suggestions.
    default: system.data_classification.results
  review_due_business_days:
    description: Business days stewards have to complete a batch.
    default: "10"
  business_timezone:
    description: IANA time zone for the scan schedule and batch due times (17:00 local).
    default: UTC
  detect_orphaned_tags:
    description: Open ORPHANED_TAG items for tags without framework review evidence. Off for the pilot.
    default: "false"
  review_app_name:
    description: Name of the review App in this workspace (<=30 chars, lowercase and hyphens). Emails link to it.
  warehouse_id:
    description: SQL warehouse the review App uses to read queues and write submissions.
  smtp_host:
    description: SMTP relay for review-request emails. Empty disables email; reviewers still see queues in the App.
    default: ""
  smtp_port:
    description: SMTP port (587 for STARTTLS).
    default: "587"
  smtp_sender:
    description: From address on review-request emails. Required when smtp_host is set.
    default: ""
  smtp_secret_scope:
    description: Secret scope holding optional smtp_username and smtp_password keys. Empty for an unauthenticated relay.
    default: ""
  smtp_use_tls:
    description: Use STARTTLS when connecting to the SMTP relay.
    default: "true"
  allowed_values_override:
    description: dev only. Comma-separated allowed values used instead of the governed-tag policy (sandboxes only).
    default: ""
  framework_service_principal:
    description: Application ID of the framework service principal (qa and prod run as this identity).
    default: ""
  excluded_table_regex:
    description: Tables matching this regex are never scanned (defaults exclude pipeline-internal backing tables and event logs).
    default: "^__|^event_log_[0-9a-f]{8}(_[0-9a-f]{4}){3}_[0-9a-f]{12}$"
  failure_notification_emails:
    description: Addresses notified when any framework job fails.
    type: complex
    default: []

targets:
  dev:
    mode: development
    default: true
    presets:
      # Development mode pauses schedules but not file-arrival/table-update triggers; pause them
      # explicitly so dev jobs run only when started manually.
      trigger_pause_status: PAUSED
    variables:
      env: dev
      governance_catalog: dev_delivery_gold
      governed_catalog_prefix: dev_
      governance_group: data_governance
      platform_group: data_platform

  qa:
    mode: production
    variables:
      env: qa
      governance_catalog: qa_delivery_gold
      governed_catalog_prefix: qa_
      governance_group: data_governance
      platform_group: data_platform
    run_as:
      service_principal_name: ${var.framework_service_principal}

  prod:
    mode: production
    variables:
      env: prod
      governance_catalog: prod_delivery_gold
      governed_catalog_prefix: prod_
      governance_group: data_governance
      platform_group: data_platform
    run_as:
      service_principal_name: ${var.framework_service_principal}
